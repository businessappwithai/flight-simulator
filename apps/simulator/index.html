<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Flight World</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Cpath d=%27M8 1l1.4 5.2L15 8l-5.6 1.2L8 15l-1.4-5.8L1 8l5.6-1.8z%27 fill=%27%23f5a623%27/%3E%3C/svg%3E">
<style>
:root{--panel:rgba(12,16,22,.74);--line:rgba(255,255,255,.14);--text:#eef3f8;--muted:#9fb0c2;--accent:#f5a623;--ok:#3ddc84;--bad:#ff5a52;
 --gap:10px;--safe-l:max(var(--gap),env(safe-area-inset-left));--safe-r:max(var(--gap),env(safe-area-inset-right));--safe-t:max(var(--gap),env(safe-area-inset-top));--safe-b:max(var(--gap),env(safe-area-inset-bottom));
 --map:200px;--dock-h:clamp(170px,30vh,300px);
 font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1118;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#root{position:fixed;inset:0}
.view{position:fixed!important;inset:0;touch-action:none}
.fallback{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);background:#0b1118}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.k{color:var(--muted)}
/* Top bar: status chips on the left, commands on the right; wraps cleanly on tablets. */
.top{position:fixed;top:var(--safe-t);left:var(--safe-l);right:var(--safe-r);display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
.chips,.buttons{display:flex;gap:6px;flex-wrap:wrap}.buttons{justify-content:flex-end}
.chip{padding:6px 10px;font-size:12px;line-height:1.2;white-space:nowrap}.chip b{font-weight:650}.chip .k{margin-right:4px}
.phase.OUTBOUND,.phase.RETURN{color:#9fd3ff}.phase.COMPLETE{color:var(--ok)}.phase.FAILED{color:var(--bad)}
button{font:inherit;font-size:12px;color:var(--text);background:rgba(30,40,54,.88);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:6px 10px;min-height:32px;cursor:pointer;touch-action:manipulation}
button:hover{background:rgba(48,62,82,.95)}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
/* Bottom dock: readout · instruments · map. One flex row that shrinks, so nothing overlaps at any width. */
.dock{position:fixed;left:var(--safe-l);right:var(--safe-r);bottom:var(--safe-b);height:var(--dock-h);display:flex;gap:var(--gap);align-items:flex-end;justify-content:center;pointer-events:none}
.dock>*{pointer-events:auto}
.readout{flex:0 0 150px;align-self:flex-end;padding:10px 12px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.readout .k{display:inline-block;width:40px}
.instruments{flex:0 1 calc(var(--dock-h) * 1.5);max-width:560px;min-width:0;height:100%;padding:6px}
.instruments canvas,.map canvas{width:100%;height:100%;display:block}
.map{flex:0 0 var(--map);height:var(--map);padding:6px}.map canvas{border-radius:6px}
.banner{position:fixed;top:24%;left:50%;transform:translateX(-50%);padding:14px 22px;font-size:20px;font-weight:700;text-align:center;max-width:calc(100vw - 30px)}
.banner small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:4px}
.error{position:fixed;left:50%;top:110px;transform:translateX(-50%);padding:10px 14px;color:#ffd7d4;border-color:rgba(255,90,82,.6);max-width:calc(100vw - 20px);font-size:13px}
.help{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:16px}
.help .panel{padding:18px 22px;max-width:560px;font-size:14px;line-height:1.6;max-height:100%;overflow:auto}
.help kbd{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid #556;border-bottom-width:2px;border-radius:4px;background:#1c2330;font:12px ui-monospace,monospace;text-align:center}
/* Touch yoke: shown on touch devices (iPad), sits above the dock on the left. */
.pad{position:fixed;left:var(--safe-l);bottom:calc(var(--safe-b) + var(--dock-h) + var(--gap));display:none;grid-template-columns:repeat(3,56px);gap:8px}
.pad button{height:52px;font-size:18px}
@media (pointer:coarse){.pad{display:grid}}
/* iPad portrait and small laptops: drop the duplicate text readout, keep instruments + map. */
@media (max-width:1100px){.readout{display:none}}
@media (max-width:900px){:root{--map:170px}.chip.opt{display:none}}
/* Phones */
@media (max-width:600px){:root{--map:112px;--dock-h:32vh}.buttons button{padding:5px 8px}.dock{align-items:flex-end}.banner{top:30%;font-size:17px}.pad{grid-template-columns:repeat(3,48px)}.pad button{height:44px}}
@media (max-height:500px){:root{--dock-h:44vh;--map:130px}}
</style>
</head>
<body>
<div id="root"></div>
<noscript>Flight World needs JavaScript and WebGL.</noscript>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
